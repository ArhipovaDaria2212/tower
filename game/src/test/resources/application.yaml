# Test profile resources.
#
# Spring Boot picks up src/test/resources/application.yaml ahead of src/main/resources/application.yaml
# during tests, so this file shadows the production config and removes the requirement to set
# JWT_SECRET / DB_URL / etc. as environment variables. The Testcontainers PostgreSQL container
# overrides spring.datasource.* via @ServiceConnection — the placeholder values below only exist
# so Spring's property resolver doesn't fail before that override kicks in.
spring:
  application:
    name: tower-test
  datasource:
    url: jdbc:postgresql://localhost:5432/tower_test
    username: postgres
    password: postgres
    driver-class-name: org.postgresql.Driver
  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
  flyway:
    enabled: true
    baseline-on-migrate: true
    locations: classpath:db/migration

jwt:
  secret: test-jwt-secret-key-minimum-32-chars-for-hmac-sha256-signing
  expiration: 3600000

server:
  port: 0

cors:
  allowed-origins: http://localhost,http://127.0.0.1

logging:
  level:
    root: INFO
    org.springframework.security: WARN
